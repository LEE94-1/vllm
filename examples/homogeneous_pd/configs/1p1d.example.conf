#
# PD-disaggregated baseline: 1 prefill node + 1 decode node.
#
# Each node owns one full 8x A800 box (TP=8) so this topology maps onto a
# 2-node cluster.
#
# Run on each machine:
#   ./launchers/launch_node.sh configs/1p1d.conf $INDEX
#   # INDEX = 0 on the prefill host, 1 on the decode host.
#
# On the router host:
#   ./launchers/launch_router.sh configs/1p1d.conf
#
# Index : 0          1
# Role  : prefill    decode
# Host  : .1         .2

TYPE="pd_disagg"

ROLES=("kv_producer" "kv_consumer")
NODE_HOSTS=("10.0.0.1" "10.0.0.2")
NODE_PORTS=(61003 61003)
# Each entry is a CUDA_VISIBLE_DEVICES string for that node. TP=8 means all
# 8 GPUs on the box; change to a subset (e.g. "0,1,2,3") if you want TP=4.
NODE_GPUS=("0,1,2,3,4,5,6,7" "0,1,2,3,4,5,6,7")
NODE_SIDE_CHANNEL_PORTS=(5559 5659)

# ---- Model + execution ------------------------------------------------------
MODEL="/nfs/FM/yangyifan/ckpts/Kimi-K2___5_reap_E288"
TENSOR_PARALLEL_SIZE=8
TRUST_REMOTE_CODE=1
ATTENTION_BACKEND="FLASHINFER"
ENFORCE_EAGER=0

# Memory + batching. SGLang baseline: prefill 0.85, decode 0.90,
# chunked-prefill-size 16384. We use the same numbers for fairness across
# the matched homogeneous experiment, prefill side (0.85 is the smaller
# of the two so it bounds the homogeneous setup that does both phases).
GPU_MEMORY_UTILIZATION=0.85
MAX_NUM_BATCHED_TOKENS=16384
MAX_NUM_SEQS=256
MAX_MODEL_LEN=16384

# ---- Router -----------------------------------------------------------------
ROUTER_HOST="0.0.0.0"
ROUTER_PORT=8000

# Optional overrides (defaults live in launchers/common.sh):
# BLOCK_SIZE=16
# KV_BUFFER_DEVICE="cuda"
# LOG_DIR="/tmp/homogeneous_pd_logs"
