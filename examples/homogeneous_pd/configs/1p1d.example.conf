#
# PD-disaggregated baseline: 1 prefill node + 1 decode node.
#
# Copy this file (e.g. `cp 1p1d.example.conf 1p1d.conf`) and edit the IPs to
# match your cluster, then on each machine run:
#
#   ./launchers/launch_node.sh configs/1p1d.conf $INDEX
#
# where INDEX is 0 on the prefill machine and 1 on the decode machine.
# On a separate (or the same) machine, run:
#
#   ./launchers/launch_router.sh configs/1p1d.conf
#
# Index : 0          1
# Role  : prefill    decode
# Host  : .1         .2

TYPE="pd_disagg"

ROLES=("kv_producer" "kv_consumer")
NODE_HOSTS=("10.0.0.1" "10.0.0.2")
NODE_PORTS=(8100        8200)
NODE_GPUS=("0"          "0")
NODE_SIDE_CHANNEL_PORTS=(5559  5659)

MODEL="meta-llama/Llama-3.1-8B-Instruct"

ROUTER_HOST="0.0.0.0"
ROUTER_PORT=8000

# Optional overrides (defaults live in launchers/common.sh):
# BLOCK_SIZE=16
# MAX_MODEL_LEN=16384
# MAX_NUM_BATCHED_TOKENS=8192
# MAX_NUM_SEQS=256
# GPU_MEMORY_UTILIZATION=0.85
# KV_BUFFER_DEVICE="cuda"
# LOG_DIR="/tmp/homogeneous_pd_logs"
