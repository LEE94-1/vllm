#
# Homogeneous PD cluster: 2 nodes, each acting as both prefill and decode.
# Designed to match the 1P1D baseline (configs/1p1d.example.conf) on the
# same hardware.
#
# Run on each machine:
#   ./launchers/launch_node.sh configs/homogeneous_2node.conf $INDEX
#
# On the router host:
#   ./launchers/launch_router.sh configs/homogeneous_2node.conf
#
# Index : 0          1
# Role  : kv_both    kv_both
# Host  : .1         .2

TYPE="homogeneous"

ROLES=("kv_both" "kv_both")
NODE_HOSTS=("10.0.0.1" "10.0.0.2")
NODE_PORTS=(8100        8100)
NODE_GPUS=("0"          "0")
NODE_SIDE_CHANNEL_PORTS=(5559  5559)

MODEL="meta-llama/Llama-3.1-8B-Instruct"

ROUTER_HOST="0.0.0.0"
ROUTER_PORT=8000

# Homogeneous-scheduler knobs.
ALPHA=16
BUDGET_FN="linear_ratio"
PREFILL_MIN=0    # 0 = no floor on per-step prefill tokens.
PREFILL_MAX=0    # 0 = no ceiling on per-step prefill tokens.

# Optional overrides (defaults live in launchers/common.sh):
# BLOCK_SIZE=16
# MAX_MODEL_LEN=16384
# MAX_NUM_BATCHED_TOKENS=8192
# MAX_NUM_SEQS=256
# GPU_MEMORY_UTILIZATION=0.85
# KV_BUFFER_DEVICE="cuda"
# LOG_DIR="/tmp/homogeneous_pd_logs"
