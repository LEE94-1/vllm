#
# PD-disaggregated baseline: 3 prefill nodes + 1 decode node.
#
# Run on each machine:
#   ./launchers/launch_node.sh configs/3p1d.conf $INDEX
#
# Indices 0..2 = prefill, index 3 = decode. The router can run anywhere that
# can reach all four hosts.
#
# Index : 0          1          2          3
# Role  : prefill    prefill    prefill    decode
# Host  : .1         .2         .3         .4

TYPE="pd_disagg"

ROLES=("kv_producer" "kv_producer" "kv_producer" "kv_consumer")
NODE_HOSTS=("10.0.0.1"  "10.0.0.2"  "10.0.0.3"  "10.0.0.4")
NODE_PORTS=(8100         8100         8100         8200)
NODE_GPUS=("0"           "0"          "0"          "0")
NODE_SIDE_CHANNEL_PORTS=(5559  5559  5559  5659)

MODEL="meta-llama/Llama-3.1-8B-Instruct"

ROUTER_HOST="0.0.0.0"
ROUTER_PORT=8000

# Optional overrides (defaults live in launchers/common.sh):
# BLOCK_SIZE=16
# MAX_MODEL_LEN=16384
# MAX_NUM_BATCHED_TOKENS=8192
# MAX_NUM_SEQS=256
# GPU_MEMORY_UTILIZATION=0.85
# KV_BUFFER_DEVICE="cuda"
# LOG_DIR="/tmp/homogeneous_pd_logs"
