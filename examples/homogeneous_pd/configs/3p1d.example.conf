#
# PD-disaggregated baseline: 3 prefill nodes + 1 decode node.
# Each node is one full 8x A800 box (TP=8) -> 4 machines total.
#
# Run on each machine:
#   ./launchers/launch_node.sh configs/3p1d.conf $INDEX
#
# Indices 0..2 = prefill, index 3 = decode. The router can run anywhere
# that can reach all four hosts.
#
# Index : 0          1          2          3
# Role  : prefill    prefill    prefill    decode
# Host  : .1         .2         .3         .4

TYPE="pd_disagg"

ROLES=("kv_producer" "kv_producer" "kv_producer" "kv_consumer")
NODE_HOSTS=("10.0.0.1" "10.0.0.2" "10.0.0.3" "10.0.0.4")
NODE_PORTS=(61003 61003 61003 61003)
NODE_GPUS=(
  "0,1,2,3,4,5,6,7"
  "0,1,2,3,4,5,6,7"
  "0,1,2,3,4,5,6,7"
  "0,1,2,3,4,5,6,7"
)
NODE_SIDE_CHANNEL_PORTS=(5559 5559 5559 5659)

# ---- Model + execution ------------------------------------------------------
MODEL="/nfs/FM/yangyifan/ckpts/Kimi-K2___5_reap_E288"
TENSOR_PARALLEL_SIZE=8
TRUST_REMOTE_CODE=1
ATTENTION_BACKEND="FLASHINFER"
ENFORCE_EAGER=0

GPU_MEMORY_UTILIZATION=0.85
MAX_NUM_BATCHED_TOKENS=16384
MAX_NUM_SEQS=256
MAX_MODEL_LEN=16384

# ---- Router -----------------------------------------------------------------
ROUTER_HOST="0.0.0.0"
ROUTER_PORT=8000

# Optional overrides (defaults live in launchers/common.sh):
# BLOCK_SIZE=16
# KV_BUFFER_DEVICE="cuda"
# LOG_DIR="/tmp/homogeneous_pd_logs"
